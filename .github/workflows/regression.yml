name: TestMu SDET-2 — Regression Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Parallelise API and UI test suites across jobs
        suite: [api, ui, integration]

    name: Run ${{ matrix.suite }} tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install Chrome (for UI tests)
        if: matrix.suite == 'ui' || matrix.suite == 'integration'
        uses: browser-actions/setup-chrome@v1

      - name: Install Firefox (for cross-browser tests)
        if: matrix.suite == 'ui'
        uses: browser-actions/setup-firefox@v1

      - name: Run ${{ matrix.suite }} tests
        run: |
          mvn test \
            -Dheadless=true \
            -Dsuite=${{ matrix.suite }} \
            -Denv=ci \
            --no-transfer-progress
        env:
          DISPLAY: :99

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report --no-transfer-progress

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.suite }}
          path: target/allure-results
          retention-days: 7

      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.suite }}
          path: target/site/allure-maven-plugin
          retention-days: 7

      - name: Upload Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ matrix.suite }}
          path: reports/screenshots/
          retention-days: 7

      - name: Notify on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **${{ matrix.suite }} tests failed** on commit ${context.sha.substring(0,7)}. [View artifacts](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            }).catch(() => {
              console.log('Not a PR — skipping comment');
            });
